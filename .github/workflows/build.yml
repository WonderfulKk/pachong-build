name: Build Linux Binary
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests pandas -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: Build Linux binary
        run: pyinstaller -F Pachong.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-pachong
          path: dist/Pachong
